<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ request.url_for('static', path='css/main.css') }}">



<title>hypergraph viewer</title>

<script type="importmap">
{
  "imports": {
    "three": "{{ request.url_for('static', path='vendor/three/build/three.module.js') }}",
    "three/addons/": "{{ request.url_for('static', path='vendor/three/examples/jsm/') }}"
  }
}
</script>
</head>

<body>

<div id="app-root">

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="menu-left">
      <span class="app-title">Hypergraph</span>
      <button class="top-btn">File</button>
      <button class="top-btn">Edit</button>
      <button class="top-btn">View</button>
      <button class="top-btn">Arrange</button>
      <button class="top-btn">Extras</button>
      <button class="top-btn">Help</button>
      <button class="top-btn" id="import-btn">Import</button>
      <button class="top-btn" id="export-btn">Export</button>

      
      <button id="create-hyperedge-btn" class="top-btn">
        + Hyperedge
      </button>

    <div class="menu-right">
      <span class="status">100%</span>
    </div>
  </header>

  <!-- Main Area -->
  <div class="main-area">

    <!-- Left Sidebar -->
    <aside class="left-sidebar">
      <div class="section">
        <button class="section-header">Standard</button>
        <div class="section-body">…</div>
      </div>

      <div class="section">
        <button class="section-header">General</button>
        <div class="section-body">…</div>
      </div>

      <div class="section">
        <button class="section-header">UML</button>
        <div class="section-body">
         <div id="uml-palette" draggable="true" data-type="plane">
  <canvas width="40" height="40"></canvas>
</div>

</div>
      </div>

      <div class="section">
        <button class="section-header">Bio</button>
        <div class="section-body">
         <div id="palette" class="palette-sidebar"></div>
        </div>
      </div>
    </aside>

    <!-- Canvas -->
    <main class="canvas-wrapper">
      <canvas id="threejs"></canvas>
    </main>

    <!-- Right Sidebar -->
    <aside class="right-sidebar">
      <h3>Diagram</h3>
      <label><input type="checkbox" checked /> Grid</label>
      <label><input type="checkbox" checked /> Guides</label>

      <h3>Style</h3>
      <label><input type="checkbox" /> Shadows</label>
      <label><input type="checkbox" /> Connection Arrows</label>
    </aside>

     <div id="layer-controls">

    <div id="layer-list"></div>
  </div>

  <div id="info-box"></div>

  </div>
</div>


<script type="module" src="{{ request.url_for('static', path='js/app.js') }}"></script>


</body>
