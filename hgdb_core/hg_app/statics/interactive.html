<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Hypergraph</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
      }
      #controls {
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      button {
        padding: 8px 12px;
        cursor: pointer;
      }
      #hypergraph-container {
        display: flex;
        gap: 20px;
      }
      #graph-area {
        flex: 3;
        border: 1px solid #ddd;
        border-radius: 5px;
        overflow: hidden;
      }
      #info-panel {
        flex: 1;
        border: 1px solid #ddd;
        border-radius: 5px;
        padding: 15px;
        overflow-y: auto;
        max-height: 600px;
      }
      .node {
        fill: black;
        stroke: white;
        stroke-width: 1.5px;
        cursor: pointer;
      }
      .node-label {
        font-size: 14px;
        text-anchor: middle;
        pointer-events: none;
        user-select: none;
      }
      .hyperedge {
        opacity: 0.6;
      }
      .highlight {
        stroke: red;
        stroke-width: 2px;
      }
      .info-title {
        font-weight: bold;
        margin-bottom: 10px;
        font-size: 16px;
      }
      .info-item {
        margin-bottom: 8px;
      }
      .info-label {
        font-weight: bold;
        display: inline-block;
        width: 120px;
      }
      .single-node-hyperedge {
        stroke: #333;
        stroke-width: 1px;
        stroke-dasharray: 3, 3;
      }
      .legend {
        font-size: 12px;
      }
      .legend rect {
        stroke: #333;
        stroke-width: 0.5px;
      }
    </style>
  </head>
  <body>
    <h1>Hypergraph Visualization</h1>

    <div id="controls">
      <button id="load-btn">Reload Data</button>
      <button id="rotate-btn">Rotate 360°</button>
      <button id="reset-btn">Reset View</button>
      <span>Zoom: </span>
      <button id="zoom-in">+</button>
      <button id="zoom-out">-</button>
    </div>

    <div id="hypergraph-container">
      <div id="graph-area">
        <svg id="hypergraph" width="700" height="800">
          <defs>
            <marker
              id="arrowhead"
              markerWidth="10"
              markerHeight="7"
              refX="10"
              refY="3.5"
              orient="auto"
            >
              <polygon points="0 0, 10 3.5, 0 7" fill="black" />
            </marker>
          </defs>
        </svg>
      </div>
      <div id="info-panel">
        <div class="info-title">Node Information</div>
        <div id="node-info">Click on a node to see details</div>
      </div>
    </div>

    <script>
      // Global variables
      let nodes = [];
      let hyperedges = [];
      let simulation;
      let initialPositions = {};

      const svg = d3.select("#hypergraph");
      const width = +svg.attr("width");
      const height = +svg.attr("height");

      // Setup zoom behavior
      const zoomGroup = svg.append("g");
      const zoom = d3
        .zoom()
        .scaleExtent([0.5, 3])
        .on("zoom", (event) => {
          zoomGroup.attr("transform", event.transform);
        });

      svg.call(zoom);

      // Function to calculate circular positions
      function calculateCircularPositions(nodeCount, centerX, centerY, radius) {
        const positions = {};
        const angleStep = (2 * Math.PI) / nodeCount;

        for (let i = 0; i < nodeCount; i++) {
          const angle = i * angleStep;
          positions[`v${i + 1}`] = {
            x: centerX + radius * Math.cos(angle),
            y: centerY + radius * Math.sin(angle),
          };
        }
        return positions;
      }

      // Main data loading function
      async function loadData() {
        try {
          const response = await fetch("test_edge.json");
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const data = await response.json();

          // Process nodes and edges
          const nodeSet = new Set();
          hyperedges = data
            .map((edge) => {
              const headNodes = edge.head_hyper_nodes.map((n) => n.id);
              const tailNodes = edge.tail_hyper_nodes
                ? edge.tail_hyper_nodes.map((n) => n.id)
                : [];
              const allNodes = [...headNodes, ...tailNodes];

              allNodes.forEach((node) => nodeSet.add(node));

              return {
                id: edge.id,
                nodes: allNodes,
                color: getColorForEdge(edge.id),
                directed: edge.directed,
                headNodes: headNodes,
                tailNodes: tailNodes,
                layer: edge.layer || 0,
              };
            })
            .filter((edge) => edge !== null);

          // Calculate default positions in a circle
          const nodeIds = Array.from(nodeSet);
          const defaultPositions = calculateCircularPositions(
            nodeIds.length,
            width / 2.5,
            height / 2.5,
            Math.min(width, height) * 0.3
          );

          // Create nodes with initial positions
          nodes = nodeIds.map((nodeId) => {
            // Use saved position if available, otherwise use default circular position
            const pos = initialPositions[nodeId] ||
              defaultPositions[nodeId] || {
                x: width / 2 + (Math.random() - 0.5) * 200,
                y: height / 2 + (Math.random() - 0.5) * 200,
              };

            if (!initialPositions[nodeId]) {
              initialPositions[nodeId] = { x: pos.x, y: pos.y };
            }

            return {
              id: nodeId,
              x: pos.x,
              y: pos.y,
              fx: pos.x,
              fy: pos.y,
            };
          });

          // Initialize or restart simulation
          if (simulation) {
            simulation.nodes(nodes);
            simulation.alpha(1).restart();
          } else {
            simulation = d3
              .forceSimulation(nodes)
              .force("charge", d3.forceManyBody().strength(-80))
              .force("center", d3.forceCenter(width / 2.5, height / 2.5))
              .force("collision", d3.forceCollide(30))
              .on("tick", () => {
                drawHypergraph();
              });
          }

          drawHypergraph();
        } catch (error) {
          document.getElementById("node-info").innerHTML = `
                  <div class="info-item" style="color: red;">
                      <strong>Error loading data:</strong> ${error.message}
                  </div>
              `;
        }
      }

      // Helper function to generate consistent colors for edges
      function getColorForEdge(edgeId) {
        const colors = ["#c49ffc", "#f294d9", "#6fc5ed", "#a5f0a8", "#fcc09f"];
        const hash = edgeId
          .split("")
          .reduce((acc, char) => acc + char.charCodeAt(0), 0);
        return colors[hash % colors.length];
      }

      // Main drawing function
      function drawHypergraph() {
        zoomGroup.selectAll("*").remove();

        // Draw hyperedges (larger size)
        hyperedges.forEach((edge) => {
          const nodePositions = edge.nodes.map((nodeId) => {
            const node = nodes.find((n) => n.id === nodeId);
            return node;
          });

          if (nodePositions.length === 1) {
            const pos = nodePositions[0];
            zoomGroup
              .append("circle")
              .attr("cx", pos.x)
              .attr("cy", pos.y)
              .attr("r", 40) // Larger size for single-node hyperedges
              .attr("fill", edge.color)
              .attr("class", "hyperedge single-node-hyperedge");
          } else {
            const centerX = d3.mean(nodePositions, (d) => d.x);
            const centerY = d3.mean(nodePositions, (d) => d.y);

            const distances = nodePositions.map((pos) =>
              Math.sqrt(
                Math.pow(pos.x - centerX, 2) + Math.pow(pos.y - centerY, 2)
              )
            );
            const maxDist = Math.max(80, d3.max(distances)); // Larger minimum distance
            const ellipseWidth = maxDist * 2.2; // Larger ellipses
            const ellipseHeight = ellipseWidth * 0.6;

            let angle = 0;
            if (nodePositions.length >= 2) {
              const p1 = nodePositions[0];
              const p2 = nodePositions[1];
              angle = (Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180) / Math.PI;
            }

            zoomGroup
              .append("ellipse")
              .attr("cx", centerX)
              .attr("cy", centerY)
              .attr("rx", ellipseWidth / 2)
              .attr("ry", ellipseHeight / 2)
              .attr("transform", `rotate(${angle}, ${centerX}, ${centerY})`)
              .attr("fill", edge.color)
              .attr("class", "hyperedge");
          }
        });

        // Draw nodes (fixed positions)
        const nodeElements = zoomGroup
          .selectAll(".node")
          .data(nodes)
          .enter()
          .append("circle")
          .attr("class", "node")
          .attr("r", 9)
          .attr("cx", (d) => d.x)
          .attr("cy", (d) => d.y)
          .on("click", function (event, d) {
            const connectedEdges = hyperedges
              .filter((e) => e.nodes.includes(d.id))
              .map((e) => ({
                id: e.id,
                directed: e.directed,
                layer: e.layer,
              }));

            const infoHtml = `
                        <div class="info-item"><span class="info-label">Node ID:</span> ${
                          d.id
                        }</div>
                        <div class="info-item"><span class="info-label">Position:</span> (${Math.round(
                          d.x
                        )}, ${Math.round(d.y)})</div>
                        <div class="info-item"><span class="info-label">Connected Edges:</span> ${connectedEdges
                          .map((e) => e.id)
                          .join(", ")}</div>
                        <div class="info-item"><span class="info-label">Degree:</span> ${
                          connectedEdges.length
                        }</div>
                    `;

            document.getElementById("node-info").innerHTML = infoHtml;
            d3.select(this).classed("highlight", true);
            d3.selectAll(".node")
              .filter((node) => node.id !== d.id)
              .classed("highlight", false);
          })
          .call(
            d3
              .drag()
              .on("start", dragstarted)
              .on("drag", dragged)
              .on("end", dragended)
          )
          .on("mouseover", function () {
            d3.select(this).attr("r", 14);
          })
          .on("mouseout", function () {
            d3.select(this).attr("r", 12);
          });

        // Draw node labels
        zoomGroup
          .selectAll(".node-label")
          .data(nodes)
          .enter()
          .append("text")
          .attr("class", "node-label")
          .attr("x", (d) => d.x)
          .attr("y", (d) => d.y + 20)
          .text((d) => d.id);

        // Add legend
        const legend = svg
          .append("g")
          .attr("class", "legend")
          .attr("transform", "translate(20, 20)");

        hyperedges.forEach((edge, index) => {
          const y = index * 20;
          legend
            .append("rect")
            .attr("x", 0)
            .attr("y", y)
            .attr("width", 15)
            .attr("height", 15)
            .attr("fill", edge.color)
            .attr("class", "legend-rect");

          legend
            .append("text")
            .attr("x", 20)
            .attr("y", y + 12)
            .text(edge.id)
            .attr("class", "legend-text");
        });
      }

      // Control functions
      function rotateGraph() {
        const centerX = width / 2;
        const centerY = height / 2;
        zoomGroup
          .transition()
          .duration(2000)
          .attrTween("transform", function () {
            const currentTransform = d3.zoomTransform(svg.node());
            return function (t) {
              return `rotate(${
                t * 360
              }, ${centerX}, ${centerY}) ${currentTransform}`;
            };
          });
      }

      // Drag functions
      function dragstarted(event, d) {
        d3.select(this).raise().attr("stroke", "red");
        d.ox = d.x;
        d.oy = d.y;
      }

      function dragged(event, d) {
        d.x = event.x;
        d.y = event.y;
        d3.select(this).attr("cx", d.x).attr("cy", d.y);

        zoomGroup
          .selectAll(".node-label")
          .filter((dd) => dd.id === d.id)
          .attr("x", d.x)
          .attr("y", d.y + 15);

        drawHypergraph();
      }

      function dragended(event, d) {
        d3.select(this).attr("stroke", "white");
        // Update initial position when node is moved
        initialPositions[d.id] = { x: d.x, y: d.y };
      }

      function resetView() {
        // Reset node positions to initial positions
        nodes.forEach((node) => {
          if (initialPositions[node.id]) {
            node.x = initialPositions[node.id].x;
            node.y = initialPositions[node.id].y;
          }
          node.fx = null;
          node.fy = null;
        });

        // Reset simulation
        simulation.alpha(1).restart();

        // Reset zoom
        svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity);
      }

      // Initialize controls
      document.getElementById("load-btn").addEventListener("click", loadData);
      document
        .getElementById("rotate-btn")
        .addEventListener("click", rotateGraph);
      document.getElementById("reset-btn").addEventListener("click", resetView);
      document.getElementById("zoom-in").addEventListener("click", () => {
        svg.transition().call(zoom.scaleBy, 1.2);
      });
      document.getElementById("zoom-out").addEventListener("click", () => {
        svg.transition().call(zoom.scaleBy, 0.8);
      });

      // Initial load
      loadData();
    </script>
  </body>
</html>
